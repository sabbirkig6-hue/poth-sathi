<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0759c7">
<title>আমার দেশ | পথ সাথী</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f7fc;color:#172033}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#064db5,#0788e8);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 14px #003b8025}
.brand{flex:1;line-height:1.25}.brand small{display:block;font-size:12px;font-weight:700;opacity:.95}.brand b{font-size:21px}
.iconBtn{width:38px;height:38px;border-radius:50%;background:#ffffff28;display:grid;place-items:center;border:0;color:#fff;font-weight:800}
.app-section{display:none;padding:12px 12px 92px;max-width:820px;margin:auto}.app-section.active{display:block}
.searchWrap{background:#fff;padding:11px 14px;border-radius:15px;display:flex;gap:10px;box-shadow:0 4px 18px #0000000c;margin:8px 0 14px}
.searchWrap input{border:0;outline:none;width:100%;font-size:15px;background:transparent}
.hero{background:#fff;border-radius:18px;padding:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px #0000000c}
.catGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.cat{position:relative;background:#fff;border-radius:17px;padding:15px 9px;min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 18px #0a66ff0d;border:1px solid #edf1fa}
.cat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;margin-bottom:7px}
.cat .name{font-weight:800;font-size:14px;text-align:center}.cat .count{position:absolute;top:7px;right:7px;background:#0a66ff;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8ecf5;display:flex;justify-content:space-around;padding:8px 0;z-index:30}
.nav button{border:0;background:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#6b7280}
.nav button.active{color:#0a66ff;font-weight:900}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px #0000000b}
.avatar{width:48px;height:48px;border-radius:50%;background:#e6efff;display:grid;place-items:center;font-weight:900;color:#0a66ff;flex-shrink:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;text-align:center}
.b1{background:#eef2ff;color:#0a66ff}.b2{background:#0a66ff;color:#fff;width:100%}
.formCard{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 24px #0000000d}
.formCard input,.formCard select,.formCard textarea{width:100%;padding:13px 14px;border:1px solid #dbe2f5;border-radius:12px;margin-top:10px;font-size:14px;outline:none}
.page{position:fixed;inset:0;background:#f4f7fc;z-index:60;display:none;flex-direction:column;overflow:auto}
.profileHeader{background:linear-gradient(180deg,#0a66ff 60%,#f4f7fc 60%);padding:18px;text-align:center}
.profilePic{width:96px;height:96px;border-radius:50%;border:4px solid white;object-fit:cover;background:white}
.loginCard{background:white;border-radius:20px;padding:22px;box-shadow:0 10px 30px #00000012;text-align:center}
.callBtn,.waBtn{flex:1;text-decoration:none;border-radius:12px;padding:12px 5px;font-weight:800;text-align:center}
.callBtn{background:#0a66ff;color:white}.waBtn{background:#e7f8ed;color:#087b35}
.muted{color:#6b7280}
</style>
</head>
<body>
<header class="topbar">
  <div class="iconBtn">🇧🇩</div>
  <div class="brand"><small>আমার দেশ</small><b id="logoHome">পথ সাথী</b></div>
  <button class="iconBtn" id="headerProfilePic" style="display:none" aria-label="প্রোফাইল">P</button>
  <button class="iconBtn" id="topLoginBtn" aria-label="লগইন">লগইন</button>
</header>

<main>
<section id="page-home" class="app-section active">
  <div class="searchWrap"><span>🔍</span><input id="searchBox" placeholder="সেবা খুঁজুন - ড্রাইভার, ডাক্তার, ইমাম..."></div>
  <div class="hero"><div><b style="font-size:16px">বাংলাদেশের সব সেবা</b><br><small class="muted">সারা বাংলাদেশের জন্য উন্মুক্ত</small></div><div style="text-align:right"><b id="totalCount" style="font-size:22px;color:#0a66ff">0 জন</b><br><small>সেবাদাতা</small></div></div>
  <div id="catBox" class="catGrid"></div>
</section>

<section id="page-register" class="app-section">
  <div class="formCard"><h3 style="margin:0">নতুন সেবা যোগ করুন</h3>
    <p class="muted" style="font-size:13px">সেবা যোগ করতে Google দিয়ে লগইন করুন।</p>
    <select id="fType"></select>
    <input id="fName" placeholder="আপনার নাম">
    <input id="fAddr" placeholder="ঠিকানা - জেলা, উপজেলা, গ্রাম">
    <input id="fPhone" type="tel" inputmode="tel" placeholder="ফোন - 01XXXXXXXXX">
    <textarea id="fDetails" placeholder="অভিজ্ঞতা / বিবরণ লিখুন"></textarea>
    <button class="btn b2" id="btnSubmit" style="margin-top:12px">জমা দিন</button>
    <div id="formMsg" style="margin-top:10px;font-weight:700" aria-live="polite"></div>
  </div>
</section>

<section id="page-account" class="app-section">
  <div class="profileHeader"><img id="profilePic" class="profilePic" src="https://i.pravatar.cc/200?u=guest" alt="প্রোফাইল ছবি"><div id="profileNameText" style="margin-top:10px;font-weight:900;font-size:18px">অতিথি</div></div>
  <div class="formCard" style="margin-top:12px"><h3>আমার প্রোফাইল</h3>
    <input id="pName" placeholder="নাম"><input id="pEmail" disabled style="background:#f3f5fb;margin-top:8px" placeholder="ইমেইল">
    <input id="pPhone" placeholder="ফোন" style="margin-top:8px"><input id="pAddress" placeholder="ঠিকানা" style="margin-top:8px">
    <button class="btn b2" id="btnSaveProfile" style="margin-top:12px">সেভ করুন</button>
    <button class="btn b1" id="btnLogout" style="width:100%;margin-top:10px">লগআউট</button>
  </div>
</section>

<section id="page-login" class="app-section"><div class="loginCard">
  <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0a66ff,#00d2ff);margin:auto auto 12px;display:grid;place-items:center;color:white;font-size:28px">প</div>
  <h3>পথ সাথী-তে স্বাগতম</h3><p class="muted">Google দিয়ে লগইন করে সারা বাংলাদেশে আপনার সেবা ছড়িয়ে দিন।</p>
  <button class="btn b2" id="btnGoogle">Google দিয়ে লগইন</button>
</div></section>
</main>

<div id="page-service" class="page">
  <div style="position:sticky;top:0;background:white;padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee">
    <button class="btn b1" id="btnBackService">ফিরে যান</button><div style="flex:1"><b id="serviceTitle">সেবা</b><br><small id="serviceCount">0 জন</small></div>
    <button class="btn b1" id="btnCloseService">বন্ধ</button>
  </div>
  <div style="max-width:820px;margin:auto;width:100%;padding:10px 12px 90px"><div class="searchWrap"><span>🔍</span><input id="serviceSearchBox" placeholder="এই সেবায় খুঁজুন..."></div><div id="serviceProviderCards"></div></div>
</div>

<nav class="nav">
  <button id="nav-home" class="active"><span style="font-size:20px">🏠</span>হোম</button>
  <button id="nav-register"><span style="font-size:20px">＋</span>ফর্ম</button>
  <button id="nav-account"><span style="font-size:20px">👤</span>প্রোফাইল</button>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyClrBlIOGz-LtuaPlynY75aIKUgUWN8LRY",
  authDomain: "pathsathi-62d84.firebaseapp.com",
  databaseURL: "https://pathsathi-62d84-default-rtdb.firebaseio.com",
  projectId: "pathsathi-62d84",
  storageBucket: "pathsathi-62d84.firebasestorage.app",
  messagingSenderId: "1078248903889",
  appId: "1:1078248903889:web:310b9ef221bccfeeaf61f0"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
const $=id=>document.getElementById(id);

function normalizeBDPhone(value){
  let n=String(value||"").replace(/\D/g,"");
  if(n.startsWith("00880")) n=n.slice(2);
  if(n.startsWith("880")) n=n.slice(3);
  if(n.startsWith("0")) n=n.slice(1);
  if(n.length===10 && n.startsWith("1")) return n;
  return "";
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SERVICES=[
["driver","ড্রাইভার","🚗","#e7f0ff"],["auto","অটো","🛺","#fff3e0"],["cng","সিএনজি","🚕","#e8f5e9"],["pickup","পিকআপ","🚚","#fce4ec"],["bus","বাস","🚌","#ede7f6"],["truck","ট্রাক","🚛","#f3e5f5"],["bike","বাইক","🏍️","#e0f2f1"],["ambulance","অ্যাম্বুলেন্স","🚑","#ffebee"],
["doctor","ডাক্তার","🩺","#e3f2fd"],["nurse","নার্স","👩‍⚕️","#fce4ec"],["pharmacy","ফার্মেসি","💊","#e8f5e9"],["hospital","হাসপাতাল","🏥","#ffebee"],["blood","রক্তদাতা","🩸","#ffebee"],["lab","ল্যাব","🔬","#e0f7fa"],
["imam","ইমাম","🕌","#e8f5e9"],["muazzin","মুয়াজ্জিন","🕌","#e0f2f1"],["bokta","বক্তা","🎙️","#fff8e1"],["nurani","নূরানী শিক্ষক","📖","#f1f8e9"],["hafez","হাফেজ","📗","#e8f5e9"],["qari","কারী","📖","#e0f2f1"],["mufti","মুফতি","📜","#fff3e0"],["khatib","খতিব","🕌","#e8f5e9"],
["electrician","ইলেকট্রিশিয়ান","💡","#fffde7"],["plumber","প্লাম্বার","🚿","#e1f5fe"],["mason","রাজমিস্ত্রি","🧱","#efebe9"],["painter","রং মিস্ত্রি","🎨","#fce4ec"],["carpenter","কাঠমিস্ত্রি","🪚","#efebe9"],["welder","ওয়েল্ডার","🔧","#e0e0e0"],["mechanic","মেকানিক","⚙️","#e3f2fd"],
["tailor","দর্জি","✂️","#f3e5f5"],["barber","নাপিত","💈","#e0f2f1"],["cook","বাবুর্চি","🍳","#fff3e0"],["teacher","শিক্ষক","👨‍🏫","#e8eaf6"],["tutor","প্রাইভেট টিউটর","📚","#e3f2fd"],["coach","কোচ","🏏","#e8f5e9"],["lawyer","উকিল","⚖️","#ede7f6"],
["photographer","ফটোগ্রাফার","📷","#f3e5f5"],["decorator","ডেকোরেটর","🎉","#fff8e1"],["it","আইটি সেবা","💻","#e3f2fd"],["web","ওয়েব ডিজাইন","🌐","#e0f7fa"],["mobile","মোবাইল সার্ভিস","📱","#e8f5e9"],
["farmer","কৃষক","🌾","#e8f5e9"],["shop","দোকানদার","🛒","#fff3e0"],["house","বাড়ি ভাড়া","🏠","#e3f2fd"],["land","জমি বিক্রি","🗺️","#efebe9"],["maid","কাজের বুয়া","🧹","#fce4ec"],["guard","গার্ড","💂","#e0e0e0"],["courier","কুরিয়ার","📦","#fff8e1"],["rentcar","গাড়ি ভাড়া","🚗","#e7f0ff"],["hajj","হজ্জ গাইড","✈️","#e8f5e9"]
];
let providers=[], currentServiceType="";
function hideAllSections(){document.querySelectorAll(".app-section").forEach(e=>e.classList.remove("active"));document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));}
function goHome(){$("page-service").style.display="none";hideAllSections();$("page-home").classList.add("active");$("nav-home").classList.add("active");}
function goPage(name){$("page-service").style.display="none";hideAllSections();$("page-"+name).classList.add("active");$("nav-"+name)?.classList.add("active");}
function initCats(){
  $("catBox").innerHTML=SERVICES.map(s=>`<div class="cat" data-type="${s[0]}"><span class="count">${providers.filter(p=>p.type===s[0]).length}</span><div class="ico" style="background:${s[3]}">${s[2]}</div><div class="name">${s[1]}</div></div>`).join("");
  document.querySelectorAll(".cat").forEach(el=>el.addEventListener("click",()=>openServicePage(el.dataset.type)));
  $("fType").innerHTML=SERVICES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
  $("totalCount").textContent=providers.length+" জন";
}
function openServicePage(type){const svc=SERVICES.find(s=>s[0]===type);if(!svc)return;currentServiceType=type;$("serviceTitle").textContent=svc[1];$("serviceSearchBox").value="";$("page-service").style.display="flex";renderServicePage();}
function closeServicePage(){$("page-service").style.display="none";}
function renderServicePage(){
  const q=$("serviceSearchBox").value.trim().toLowerCase();
  const list=providers.filter(p=>p.type===currentServiceType&&(!q||[p.name,p.address,p.phone,p.details].join(" ").toLowerCase().includes(q)));
  $("serviceCount").textContent=list.length+" জন";
  $("serviceProviderCards").innerHTML=list.map(p=>{
    const digits=normalizeBDPhone(p.phone), tel=digits?"+880"+digits:"", wa=digits?"880"+digits:"";
    const own=auth.currentUser&&p.ownerUid===auth.currentUser.uid;
    return `<div class="card">
      <div style="display:flex;gap:10px;align-items:center"><div class="avatar">${escapeHTML((p.name||"প").trim().charAt(0))}</div><div style="flex:1;min-width:0"><b>${escapeHTML(p.name||"নাম নেই")}</b><br><small>📍 ${escapeHTML(p.address||"ঠিকানা নেই")}</small><br><small>📞 ${escapeHTML(p.phone||"নম্বর নেই")}</small></div></div>
      <div style="background:#f5f7fb;border-radius:12px;padding:10px;margin-top:9px;font-size:13px">${escapeHTML(p.details||"বিবরণ দেওয়া হয়নি")}</div>
      <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
        ${digits?`<a class="callBtn" href="tel:${tel}">📞 কল করুন</a><a class="waBtn" href="https://wa.me/${wa}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>`:`<span class="muted">সঠিক বাংলাদেশি মোবাইল নম্বর নেই</span>`}
        ${own?`<button class="btn b1" data-delete="${escapeHTML(p.fbId)}">নিজের বিজ্ঞাপন মুছুন</button>`:""}
      </div></div>`;
  }).join("")||'<div style="padding:24px;text-align:center;color:#6b7280">এখনো কেউ নেই</div>';
  document.querySelectorAll("[data-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteProvider(btn.dataset.delete)));
}
function deleteProvider(id){
  if(!auth.currentUser){alert("আগে লগইন করুন");return;}
  const item=providers.find(p=>p.fbId===id);
  if(!item||item.ownerUid!==auth.currentUser.uid){alert("শুধু নিজের যোগ করা সেবাই মুছতে পারবেন");return;}
  if(confirm("নিজের এই সেবাটি মুছে ফেলবেন?"))db.ref("providers/"+id).remove().catch(e=>alert("মুছতে সমস্যা: "+e.message));
}
db.ref("providers").on("value",snap=>{
  const val=snap.val();providers=[];
  if(val)Object.keys(val).forEach(k=>providers.push({...val[k],fbId:k}));
  initCats();if(currentServiceType)renderServicePage();
},err=>alert("তথ্য লোড হয়নি: "+err.message));

$("searchBox").addEventListener("input",function(){
  const q=this.value.trim().toLowerCase();
  document.querySelectorAll(".cat").forEach(el=>{const s=SERVICES.find(x=>x[0]===el.dataset.type);el.style.display=(!q||s[1].toLowerCase().includes(q)||s[0].includes(q))?"flex":"none";});
});
$("serviceSearchBox").addEventListener("input",renderServicePage);
$("btnBackService").addEventListener("click",closeServicePage);$("btnCloseService").addEventListener("click",closeServicePage);
$("logoHome").addEventListener("click",goHome);$("nav-home").addEventListener("click",goHome);
$("nav-register").addEventListener("click",()=>goPage("register"));$("nav-account").addEventListener("click",()=>goPage("account"));
$("topLoginBtn").addEventListener("click",()=>goPage("login"));
$("btnGoogle").addEventListener("click",()=>auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(e=>alert("লগইন সমস্যা: "+e.message)));
$("btnLogout").addEventListener("click",()=>auth.signOut().then(()=>goHome()).catch(e=>alert(e.message)));
auth.getRedirectResult().catch(e=>alert("লগইন সমস্যা: "+e.message));
auth.onAuthStateChanged(async user=>{
  $("topLoginBtn").style.display=user?"none":"grid";
  $("headerProfilePic").style.display=user?"grid":"none";
  if(user){
    $("headerProfilePic").textContent=(user.displayName||"প").charAt(0);
    $("profilePic").src=user.photoURL||"https://i.pravatar.cc/200?u="+encodeURIComponent(user.uid);
    $("profileNameText").textContent=user.displayName||"ব্যবহারকারী";
    $("pName").value=user.displayName||"";$("pEmail").value=user.email||"";
    try{const s=await db.ref("profiles/"+user.uid).once("value");const d=s.val()||{};$("pPhone").value=d.phone||"";$("pAddress").value=d.address||"";}catch(e){console.warn(e);}
  }else{$("profileNameText").textContent="অতিথি";$("pEmail").value="";$("pPhone").value="";$("pAddress").value="";}
  if(currentServiceType)renderServicePage();
});
$("btnSubmit").addEventListener("click",async()=>{
  const user=auth.currentUser;
  if(!user){$("formMsg").textContent="সেবা যোগ করতে আগে Google দিয়ে লগইন করুন।";goPage("login");return;}
  const data={type:$("fType").value,name:$("fName").value.trim(),address:$("fAddr").value.trim(),phone:$("fPhone").value.trim(),details:$("fDetails").value.trim(),ownerUid:user.uid,createdAt:Date.now()};
  if(!data.name||!data.phone){$("formMsg").textContent="নাম ও ফোন নম্বর দিন";return;}
  if(!normalizeBDPhone(data.phone)){$("formMsg").textContent="সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)";return;}
  $("btnSubmit").disabled=true;$("formMsg").textContent="জমা হচ্ছে...";
  try{await db.ref("providers").push(data);$("formMsg").textContent="সফলভাবে জমা হয়েছে";$("fName").value="";$("fPhone").value="";$("fAddr").value="";$("fDetails").value="";setTimeout(goHome,700);}
  catch(e){$("formMsg").textContent="জমা হয়নি: "+e.message;}
  finally{$("btnSubmit").disabled=false;}
});
$("btnSaveProfile").addEventListener("click",async()=>{
  const user=auth.currentUser;if(!user){alert("আগে লগইন করুন");return;}
  try{await db.ref("profiles/"+user.uid).update({name:$("pName").value.trim(),phone:$("pPhone").value.trim(),address:$("pAddress").value.trim(),email:user.email||""});alert("প্রোফাইল সেভ হয়েছে");}
  catch(e){alert("সেভ হয়নি: "+e.message);}
});
initCats();
</script>
