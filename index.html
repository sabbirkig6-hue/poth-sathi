<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f7fc;color:#172033}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#064db5,#0788e8);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 14px #003b8025}
.brand{flex:1;line-height:1.25}
.brand small{display:block;font-size:12px;font-weight:700}
.brand b{font-size:21px}
.iconBtn{width:40px;height:40px;border-radius:50%;background:#ffffff28;display:grid;place-items:center;border:0;color:#fff;font-weight:800;overflow:hidden}
.iconBtn img{width:100%;height:100%;object-fit:cover}
.flagLogo{width:30px;height:20px;background:#006a4e;border-radius:3px;display:grid;place-items:center}
.flagLogo:after{content:"";width:12px;height:12px;border-radius:50%;background:#f42a41}
.app-section{display:none;padding:12px 12px 92px;max-width:820px;margin:auto}
.app-section.active{display:block}
.searchWrap{background:#fff;padding:11px 14px;border-radius:15px;display:flex;gap:10px;box-shadow:0 4px 18px #0000000c;margin:8px 0 14px}
.searchWrap input{border:0;outline:none;width:100%;font-size:15px;background:transparent}
.hero{background:#fff;border-radius:18px;padding:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px #0000000c}
.catGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.cat{position:relative;background:#fff;border-radius:17px;padding:15px 9px;min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 18px #0a66ff0d;border:1px solid #edf1fa}
.cat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;margin-bottom:7px}
.cat .name{font-weight:800;font-size:14px;text-align:center}
.cat .count{position:absolute;top:7px;right:7px;background:#0a66ff;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8ecf5;display:flex;justify-content:space-around;padding:8px 0;z-index:30}
.nav button{border:0;background:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#6b7280}
.nav button.active{color:#0a66ff;font-weight:900}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px #0000000b}
.avatar{width:48px;height:48px;border-radius:50%;background:#e6efff;display:grid;place-items:center;font-weight:900;color:#0a66ff;flex-shrink:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;text-align:center}
.btn:disabled{opacity:.6}
.b1{background:#eef2ff;color:#0a66ff}
.b2{background:#0a66ff;color:#fff;width:100%}
.formCard{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 24px #0000000d}
.formCard input,.formCard select,.formCard textarea{width:100%;padding:13px 14px;border:1px solid #dbe2f5;border-radius:12px;margin-top:10px;font-size:14px;outline:none}
.page{position:fixed;inset:0;background:#f4f7fc;z-index:60;display:none;flex-direction:column;overflow:auto}
.profileHeader{background:linear-gradient(145deg,#064db5,#0788e8);padding:30px 18px 65px;text-align:center;color:white;border-radius:0 0 30px 30px}
.profilePhotoWrap{width:112px;height:112px;margin:auto;position:relative}
.profilePic{width:112px;height:112px;border-radius:50%;border:4px solid white;object-fit:cover;background:#e6efff;box-shadow:0 5px 18px #003b8050}
.profileInitial{width:112px;height:112px;border-radius:50%;border:4px solid white;background:#e6efff;color:#0759c7;display:grid;place-items:center;font-size:43px;font-weight:900;box-shadow:0 5px 18px #003b8050}
.cameraBtn{position:absolute;right:0;bottom:2px;width:35px;height:35px;border-radius:50%;background:#fff;border:2px solid #0a66ff;display:grid;place-items:center;box-shadow:0 3px 10px #0002;cursor:pointer}
.cameraBtn svg{width:19px;height:19px;fill:#0759c7}
.profileNameRow{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:13px}
.profileName{font-size:21px;font-weight:900}
.editNameBtn{width:32px;height:32px;border:0;border-radius:50%;background:#ffffff30;color:white;font-size:17px;cursor:pointer}
.profileEmail{font-size:13px;opacity:.9;margin-top:5px}
.nameEditBox{display:none;max-width:280px;margin:15px auto 0}
.nameEditBox input{width:100%;padding:11px;border:0;border-radius:10px;font-size:15px}
.nameSaveBtn{width:100%;margin-top:9px;padding:10px;border:0;border-radius:10px;background:white;color:#0759c7;font-weight:900}
.profileInfoCard{background:white;border-radius:22px;padding:18px;margin:-42px 14px 15px;position:relative;box-shadow:0 8px 25px #0a326b12}
.hiddenFile{display:none}
.loginCard{background:white;border-radius:20px;padding:22px;box-shadow:0 10px 30px #00000012;text-align:center}
.callBtn,.waBtn{flex:1;text-decoration:none;border-radius:12px;padding:12px 5px;font-weight:800;text-align:center}
.callBtn{background:#0a66ff;color:white}
.waBtn{background:#e7f8ed;color:#087b35}
.muted{color:#6b7280}
.msg{font-size:13px;margin-top:12px;line-height:1.5;overflow-wrap:anywhere}
</style>
</head>

<body>

<header class="topbar">
<div class="flagLogo" aria-label="বাংলাদেশের পতাকা"></div>
<div class="brand">
<small>আমার দেশ</small>
<b id="logoHome">পথ সাথী</b>
</div>

<button class="iconBtn" id="headerProfilePic" style="display:none" aria-label="প্রোফাইল">
<img id="headerProfileImage" style="display:none" alt="প্রোফাইল ছবি">

<main>

<section id="page-home" class="app-section active">
<div class="searchWrap">🔍 <input id="searchBox" placeholder="সেবা খুঁজুন - ড্রাইভার, ডাক্তার, ইমাম..."></div>
<div class="hero">
<div><b>বাংলাদেশের সব সেবা</b><br><small class="muted">সারা বাংলাদেশের জন্য উন্মুক্ত</small></div>
<div style="text-align:right"><b id="totalCount" style="font-size:22px;color:#0a66ff">0 জন</b><br><small>সেবাদাতা</small></div>
</div>
<div id="catBox" class="catGrid"></div>
</section>

<section id="page-register" class="app-section">
<div class="formCard">
<h3>নতুন সেবা যোগ করুন</h3>
<p class="muted">সেবা যোগ করতে Google দিয়ে লগইন করুন।</p>
<select id="fType"></select>
<input id="fName" placeholder="আপনার নাম">
<input id="fAddr" placeholder="ঠিকানা - জেলা, উপজেলা, গ্রাম">
<input id="fPhone" type="tel" placeholder="ফোন - 01XXXXXXXXX">
<textarea id="fDetails" placeholder="অভিজ্ঞতা / বিবরণ লিখুন"></textarea>
<button class="btn b2" id="btnSubmit" style="margin-top:12px">জমা দিন</button>
<div id="formMsg" class="msg"></div>
</div>
</section>

<section id="page-account" class="app-section">
<div class="profileHeader">
<div class="profilePhotoWrap">
<img id="profilePic" class="profilePic" style="display:none" alt="প্রোফাইল ছবি">
<div id="profileInitial" class="profileInitial">অ</div>
<label class="cameraBtn" for="profileImageInput" aria-label="ছবি পরিবর্তন">
<svg viewBox="0 0 24 24">
<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9-3h-3.17l-1.84-2H8.01L6.17 5H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 13a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/>
</svg>
</label>
<input class="hiddenFile" type="file" id="profileImageInput" accept="image/*">
</div>

<div class="profileNameRow">
<div id="profileNameText" class="profileName">অতিথি</div>
<button id="editNameBtn" class="editNameBtn" type="button" aria-label="নাম পরিবর্তন">✏️</button>
</div>

<div id="profileEmailText" class="profileEmail"></div>

<div id="nameEditBox" class="nameEditBox">
<input id="pName" type="text" placeholder="আপনার নাম লিখুন">
<button id="btnSaveProfileName" class="nameSaveBtn" type="button">সেভ করুন</button>
</div>

<div id="photoMsg" class="msg"></div>
</div>

<div class="profileInfoCard">
<b>আপনার অ্যাকাউন্ট</b>
<div id="profileAccountEmail" class="muted" style="font-size:14px;overflow-wrap:anywhere;margin-top:8px"></div>
<button class="btn b1" id="btnLogout" style="width:100%;margin-top:18px">লগআউট</button>
</div>
</section>

<section id="page-login" class="app-section">
<div class="loginCard">
<div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0a66ff,#00d2ff);margin:auto auto 12px;display:grid;place-items:center;color:white;font-size:28px">প</div>
<h3>পথ সাথী-তে স্বাগতম</h3>
<p class="muted">Google দিয়ে লগইন করে সারা বাংলাদেশে আপনার সেবা ছড়িয়ে দিন।</p>
<button class="btn b2" id="btnGoogle">Google দিয়ে লগইন</button>
<div id="loginMsg" class="msg muted">লগইন করতে Google বাটনে চাপ দিন।</div>
</div>
</section>

</main>

<div id="page-service" class="page">
<div style="position:sticky;top:0;background:white;padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee">
<button class="btn b1" id="btnBackService">ফিরে যান</button>
<div style="flex:1"><b id="serviceTitle">সেবা</b><br><small id="serviceCount">0 জন</small></div>
<button class="btn b1" id="btnCloseService">বন্ধ</button>
</div>
<div style="max-width:820px;margin:auto;width:100%;padding:10px 12px 90px">
<div class="searchWrap">🔍 <input id="serviceSearchBox" placeholder="এই সেবায় খুঁজুন..."></div>
<div id="serviceProviderCards"></div>
</div>
</div>

<nav class="nav">
<button id="nav-home" class="active"><span style="font-size:20px">🏠</span>হোম</button>
<button id="nav-register"><span style="font-size:20px">＋</span>ফর্ম</button>
<button id="nav-account"><span style="font-size:20px">👤</span>প্রোফাইল</button>
</nav>

<script>
const firebaseConfig = {
apiKey:"AIzaSyClrBlIOGz-LtuaPlynY75aIKUgUWN8LRY",
authDomain:"pathsathi-62d84.firebaseapp.com",
databaseURL:"https://pathsathi-62d84-default-rtdb.firebaseio.com",
projectId:"pathsathi-62d84",
storageBucket:"pathsathi-62d84.firebasestorage.app",
messagingSenderId:"1078248903889",
appId:"1:1078248903889:web:310b9ef221bccfeeaf61f0"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const $=id=>document.getElementById(id);

function normalizeBDPhone(value){
let n=String(value||"").replace(/\D/g,"");
if(n.startsWith("00880"))n=n.slice(2);
if(n.startsWith("880"))n=n.slice(3);
if(n.startsWith("0"))n=n.slice(1);
return n.length===10&&n.startsWith("1")?n:"";
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const SERVICES=[
["driver","ড্রাইভার","🚗","#e7f0ff"],["auto","অটো","🛺","#fff3e0"],["cng","সিএনজি","🚕","#e8f5e9"],["pickup","পিকআপ","🚚","#fce4ec"],["bus","বাস","🚌","#ede7f6"],["truck","ট্রাক","🚛","#f3e5f5"],["bike","বাইক","🏍️","#e0f2f1"],["ambulance","অ্যাম্বুলেন্স","🚑","#ffebee"],
["doctor","ডাক্তার","🩺","#e3f2fd"],["nurse","নার্স","👩‍⚕️","#fce4ec"],["pharmacy","ফার্মেসি","💊","#e8f5e9"],["hospital","হাসপাতাল","🏥","#ffebee"],["blood","রক্তদাতা","🩸","#ffebee"],["lab","ল্যাব","🔬","#e0f7fa"],
["imam","ইমাম","🕌","#e8f5e9"],["muazzin","মুয়াজ্জিন","🕌","#e0f2f1"],["bokta","বক্তা","🎙️","#fff8e1"],["nurani","নূরানী শিক্ষক","📖","#f1f8e9"],["hafez","হাফেজ","📗","#e8f5e9"],["qari","কারী","📖","#e0f2f1"],["mufti","মুফতি","📜","#fff3e0"],["khatib","খতিব","🕌","#e8f5e9"],
["electrician","ইলেকট্রিশিয়ান","💡","#fffde7"],["plumber","প্লাম্বার","🚿","#e1f5fe"],["mason","রাজমিস্ত্রি","🧱","#efebe9"],["painter","রং মিস্ত্রি","🎨","#fce4ec"],["carpenter","কাঠমিস্ত্রি","🪚","#efebe9"],["welder","ওয়েল্ডার","🔧","#e0e0e0"],["mechanic","মেকানিক","⚙️","#e3f2fd"],
["tailor","দর্জি","✂️","#f3e5f5"],["barber","নাপিত","💈","#e0f2f1"],["cook","বাবুর্চি","🍳","#fff3e0"],["teacher","শিক্ষক","👨‍🏫","#e8eaf6"],["tutor","প্রাইভেট টিউটর","📚","#e3f2fd"],["coach","কোচ","🏏","#e8f5e9"],["lawyer","উকিল","⚖️","#ede7f6"],
["photographer","ফটোগ্রাফার","📷","#f3e5f5"],["decorator","ডেকোরেটর","🎉","#fff8e1"],["it","আইটি সেবা","💻","#e3f2fd"],["web","ওয়েব ডিজাইন","🌐","#e0f7fa"],["mobile","মোবাইল সার্ভিস","📱","#e8f5e9"],
["farmer","কৃষক","🌾","#e8f5e9"],["shop","দোকানদার","🛒","#fff3e0"],["house","বাড়ি ভাড়া","🏠","#e3f2fd"],["land","জমি বিক্রি","🗺️","#efebe9"],["maid","কাজের বুয়া","🧹","#fce4ec"],["guard","গার্ড","💂","#e0e0e0"],["courier","কুরিয়ার","📦","#fff8e1"],["rentcar","গাড়ি ভাড়া","🚗","#e7f0ff"],["hajj","হজ্জ গাইড","✈️","#e8f5e9"]
];

let providers=[];
let currentServiceType="";

function hideAllSections(){
document.querySelectorAll(".app-section").forEach(e=>e.classList.remove("active"));
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
}

function goHome(){
$("page-service").style.display="none";
hideAllSections();
$("page-home").classList.add("active");
$("nav-home").classList.add("active");
}

function goPage(name){
$("page-service").style.display="none";
hideAllSections();
$("page-"+name).classList.add("active");
$("nav-"+name)?.classList.add("active");
}

function initCats(){
$("catBox").innerHTML=SERVICES.map(s=>`
<div class="cat" data-type="${s[0]}">
<span class="count">${providers.filter(p=>p.type===s[0]).length}</span>
<div class="ico" style="background:${s[3]}">${s[2]}</div>
<div class="name">${s[1]}</div>
</div>`).join("");

document.querySelectorAll(".cat").forEach(el=>{
el.addEventListener("click",()=>openServicePage(el.dataset.type));
});

$("fType").innerHTML=SERVICES.map(s=>
`<option value="${s[0]}">${s[1]}</option>`
).join("");

$("totalCount").textContent=providers.length+" জন";
}

function openServicePage(type){
const svc=SERVICES.find(s=>s[0]===type);
if(!svc)return;

currentServiceType=type;
$("serviceTitle").textContent=svc[1];
$("serviceSearchBox").value="";
$("page-service").style.display="flex";
renderServicePage();
}

function closeServicePage(){
$("page-service").style.display="none";
}

function renderServicePage(){
const q=$("serviceSearchBox").value.trim().toLowerCase();

const list=providers.filter(p=>
p.type===currentServiceType &&
(!q||[p.name,p.address,p.phone,p.details].join(" ").toLowerCase().includes(q))
);

$("serviceCount").textContent=list.length+" জন";

$("serviceProviderCards").innerHTML=list.map(p=>{
const digits=normalizeBDPhone(p.phone);
const tel=digits?"+880"+digits:"";
const wa=digits?"880"+digits:"";
const own=auth.currentUser&&p.ownerUid===auth.currentUser.uid;

return `<div class="card">
<div style="display:flex;gap:10px;align-items:center">
<div class="avatar">${escapeHTML((p.name||"প").trim().charAt(0))}</div>
<div style="flex:1;min-width:0">
<b>${escapeHTML(p.name||"নাম নেই")}</b><br>
<small>📍 ${escapeHTML(p.address||"ঠিকানা নেই")}</small><br>
<small>📞 ${escapeHTML(p.phone||"নম্বর নেই")}</small>
</div>
</div>

<div style="background:#f5f7fb;border-radius:12px;padding:10px;margin-top:9px;font-size:13px">
${escapeHTML(p.details||"বিবরণ দেওয়া হয়নি")}
</div>

<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
${digits?
`<a class="callBtn" href="tel:${tel}">📞 কল করুন</a>
<a class="waBtn" href="https://wa.me/${wa}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>`
:`<span class="muted">সঠিক বাংলাদেশি মোবাইল নম্বর নেই</span>`}

${own?`<button class="btn b1" data-delete="${escapeHTML(p.fbId)}">নিজের বিজ্ঞাপন মুছুন</button>`:""}
</div>
</div>`;
}).join("") || '<div style="padding:24px;text-align:center;color:#6b7280">এখনো কেউ নেই</div>';

document.querySelectorAll("[data-delete]").forEach(btn=>{
btn.addEventListener("click",()=>deleteProvider(btn.dataset.delete));
});
}

function deleteProvider(id){
if(!auth.currentUser){
alert("আগে লগইন করুন");
return;
}

const item=providers.find(p=>p.fbId===id);

if(!item||item.ownerUid!==auth.currentUser.uid){
alert("শুধু নিজের যোগ করা সেবাই মুছতে পারবেন");
return;
}

if(confirm("নিজের এই সেবাটি মুছে ফেলবেন?")){
db.ref("providers/"+id).remove().catch(e=>
alert("মুছতে সমস্যা: "+e.message)
);
}
}

db.ref("providers").on("value",snap=>{
const val=snap.val();
providers=[];

if(val){
Object.keys(val).forEach(k=>{
providers.push({...val[k],fbId:k});
});
}

initCats();

if(currentServiceType)renderServicePage();
},err=>console.warn("ডাটাবেস সমস্যা:",err));

$("searchBox").addEventListener("input",function(){
const q=this.value.trim().toLowerCase();

document.querySelectorAll(".cat").forEach(el=>{
const s=SERVICES.find(x=>x[0]===el.dataset.type);

el.style.display=(!q||
s[1].toLowerCase().includes(q)||
s[0].includes(q))?"flex":"none";
});
});

$("serviceSearchBox").addEventListener("input",renderServicePage);
$("btnBackService").addEventListener("click",closeServicePage);
$("btnCloseService").addEventListener("click",closeServicePage);
$("logoHome").addEventListener("click",goHome);
$("nav-home").addEventListener("click",goHome);
$("nav-register").addEventListener("click",()=>goPage("register"));

if(auth.currentUser)goPage("account");

function showLoginMessage(message,isError=false){
$("loginMsg").textContent=message;
$("loginMsg").style.color=isError?"#b42318":"#526071";
}

let loginBusy=false;

async function startGoogleLogin(){
if(loginBusy)return;

loginBusy=true;

const btn=$("btnGoogle");
btn.disabled=true;
btn.textContent="Google লগইন চালু হচ্ছে...";
showLoginMessage("Google অ্যাকাউন্ট নির্বাচন করুন।");

try{
await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const provider=new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const result=await auth.signInWithPopup(provider);

if(result&&result.user){
showLoginMessage("লগইন সফল হয়েছে।");
goHome();
}

}catch(error){
console.error("Google login error:",error);

if([
"auth/popup-blocked",
"auth/operation-not-supported-in-this-environment"
].includes(error.code)){
try{
showLoginMessage("Google লগইন পেজে নেওয়া হচ্ছে...");
await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
return;
}catch(redirectError){
console.error(redirectError);
showLoginMessage("লগইন হয়নি: "+redirectError.message,true);
}
}else{
showLoginMessage("লগইন হয়নি: "+error.message,true);
alert("Google লগইন সমস্যা:\n"+error.message);
}
}

loginBusy=false;
btn.disabled=false;
btn.textContent="Google দিয়ে লগইন";
}

$("btnGoogle").addEventListener("click",startGoogleLogin);

auth.getRedirectResult().then(result=>{
if(result&&result.user){
showLoginMessage("লগইন সফল হয়েছে।");
goHome();
}
}).catch(error=>{
console.error(error);
showLoginMessage("লগইন সম্পন্ন হয়নি: "+error.message,true);
});

/* নামের প্রথম অক্ষর বের করা */
function getProfileInitial(name){
const clean=String(name||"").trim();
return clean?Array.from(clean)[0].toLocaleUpperCase("bn-BD"):"অ";
}

/* Gmail ছবি অথবা নিজের ছবি; ছবি না থাকলে নামের প্রথম অক্ষর */
function setProfilePhoto(photoData,user,name){
const initial=getProfileInitial(
name||user?.displayName||user?.email?.split("@")[0]||"অতিথি"
);

$("headerProfileLetter").textContent=initial;
$("profileInitial").textContent=initial;

const headerImage=$("headerProfileImage");
const profileImage=$("profilePic");

function showInitials(){
headerImage.style.display="none";
profileImage.style.display="none";
$("headerProfileLetter").style.display="block";
$("profileInitial").style.display="grid";
}

const photo=photoData||"";

if(!photo){
showInitials();
return;
}

headerImage.onerror=()=>{
headerImage.style.display="none";
$("headerProfileLetter").style.display="block";
};

profileImage.onerror=()=>{
profileImage.style.display="none";
$("profileInitial").style.display="grid";
};

headerImage.src=photo;
profileImage.src=photo;

headerImage.style.display="block";
profileImage.style.display="block";
$("headerProfileLetter").style.display="none";
$("profileInitial").style.display="none";
}

/* লগইন অবস্থা ও প্রোফাইল তথ্য */
auth.onAuthStateChanged(async user=>{
$("topLoginBtn").style.display=user?"none":"grid";
$("headerProfilePic").style.display=user?"grid":"none";

if(user){
$("profileNameText").textContent=user.displayName||"ব্যবহারকারী";
$("profileEmailText").textContent=user.email||"";
$("profileAccountEmail").textContent=user.email||"";
$("pName").value=user.displayName||"";

let photo=user.photoURL||"";

try{
const snap=await db.ref("profiles/"+user.uid).once("value");
const data=snap.val()||{};

$("pName").value=data.name||user.displayName||"";
if(data.photoData)photo=data.photoData;

}catch(error){
console.warn("Profile load error:",error);
}

const displayName=$("pName").value||user.displayName||"ব্যবহারকারী";
$("profileNameText").textContent=displayName;

setProfilePhoto(photo,user,displayName);
showLoginMessage("লগইন সফল: "+(user.email||""));

}else{
$("profileNameText").textContent="অতিথি";
$("profileEmailText").textContent="";
$("profileAccountEmail").textContent="";
$("pName").value="";
$("nameEditBox").style.display="none";
setProfilePhoto("",null,"অতিথি");
}

if(currentServiceType)renderServicePage();
});

/* পেন্সিলে চাপ দিলে নাম পরিবর্তনের ঘর */
$("editNameBtn").addEventListener("click",()=>{
if(!auth.currentUser){

}

/* নাম সেভ */
$("btnSaveProfileName").addEventListener("click",async()=>{
const user=auth.currentUser;
const name=$("pName").value.trim();

if(!user){
alert("আগে লগইন করুন।");
return;
}

if(!name){
alert("আপনার নাম লিখুন।");
return;
}

try{
await db.ref("profiles/"+user.uid).update({
name:name,
email:user.email||""
});

await user.updateProfile({displayName:name});

$("profileNameText").textContent=name;
$("nameEditBox").style.display="none";

const snap=await db.ref("profiles/"+user.uid).once("value");
const data=snap.val()||{};
setProfilePhoto(data.photoData||user.photoURL,user,name);

alert("নাম সফলভাবে সেভ হয়েছে।");

}catch(error){
console.error(error);
alert("নাম সেভ হয়নি: "+error.message);
}
});

/* ছবি ছোট করা */
function compressProfileImage(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();

reader.onload=event=>{
const img=new Image();

img.onload=()=>{
const canvas=document.createElement("canvas");
const maxSize=320;

let width=img.width;
let height=img.height;

if(width>height&&width>maxSize){
height=Math.round(height*maxSize/width);
width=maxSize;
}else if(height>maxSize){
width=Math.round(width*maxSize/height);
height=maxSize;
}

canvas.width=width;
canvas.height=height;

canvas.getContext("2d").drawImage(img,0,0,width,height);

resolve(canvas.toDataURL("image/jpeg",0.55));
};

img.onerror=reject;
img.src=event.target.result;
};

reader.onerror=reject;
reader.readAsDataURL(file);
});
}

/* ক্যামেরা আইকনে চাপ দিয়ে ছবি নির্বাচন */
$("profileImageInput").addEventListener("change",async function(){
const user=auth.currentUser;
const file=this.files&&this.files[0];

if(!user||!file)return;

if(!file.type.startsWith("image/")){
alert("অনুগ্রহ করে একটি ছবি নির্বাচন করুন।");
this.value="";
return;
}

$("photoMsg").textContent="ছবি প্রস্তুত হচ্ছে...";

try{
const compressedImage=await compressProfileImage(file);

$("photoMsg").textContent="ছবি সংরক্ষণ হচ্ছে...";

await db.ref("profiles/"+user.uid).update({
photoData:compressedImage,
photoUpdatedAt:Date.now()
});

setProfilePhoto(compressedImage,user,$("profileNameText").textContent);
$("photoMsg").textContent="ছবি সংরক্ষণ হয়েছে।";

}catch(error){
console.error(error);
$("photoMsg").textContent="ছবি সংরক্ষণ করা যায়নি।";
alert("ছবি সংরক্ষণে সমস্যা: "+error.message);
}

this.value="";
});

/* নতুন সেবা জমা */
$("btnSubmit").addEventListener("click",async()=>{
const user=auth.currentUser;

if(!user){
alert("সেবা যোগ করতে আগে Google দিয়ে লগইন করুন।");
goPage("login");
return;
}

const name=$("fName").value.trim();
const address=$("fAddr").value.trim();
const phone=$("fPhone").value.trim();
const type=$("fType").value;
const details=$("fDetails").value.trim();

if(!name||!address||!phone||!type){
alert("সব প্রয়োজনীয় তথ্য পূরণ করুন।");
return;
}

const providerData={
ownerUid:user.uid,
name:name,
address:address,
phone:phone,
type:type,
details:details,
createdAt:Date.now()
};

try{
await db.ref("providers").push(providerData);

alert("আপনার সেবা সফলভাবে জমা হয়েছে।");

$("fName").value="";
$("fAddr").value="";
$("fPhone").value="";
$("fDetails").value="";

goHome();

}catch(error){
console.error(error);
alert("সেবা জমা হয়নি: "+error.message);
}
});
</script>
