
name: Build Poth Sathi APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sabbir/pothsathi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PothSathi"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sabbir.pothsathi'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sabbir.pothsathi'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }

          dependencies {
              implementation 'androidx.browser:browser:1.8.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="পথ সাথী"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sabbir/pothsathi/MainActivity.java <<'EOF'
          package com.sabbir.pothsathi;

          import android.app.Activity;
          import android.os.Bundle;
          import android.net.Uri;
          import android.content.Intent;
          import android.widget.Toast;

          import androidx.browser.customtabs.CustomTabsIntent;

          public class MainActivity extends Activity {

              private static final String WEBSITE =
                  "https://sabbirkig6-hue.github.io/poth-sathi/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (savedInstanceState == null) {
                      openWebsite();
                  } else {
                      finish();
                  }
              }

              private void openWebsite() {
                  try {
                      CustomTabsIntent customTabs =
                          new CustomTabsIntent.Builder()
                              .setShowTitle(true)
                              .build();

                      customTabs.launchUrl(
                          this,
                          Uri.parse(WEBSITE)
                      );

                  } catch (Exception e) {
                      try {
                          Intent browser = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(WEBSITE)
                          );
                          startActivity(browser);
                      } catch (Exception error) {
                          Toast.makeText(
                              this,
                              "ওয়েবসাইট খোলা যাচ্ছে না",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Poth-Sathi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
